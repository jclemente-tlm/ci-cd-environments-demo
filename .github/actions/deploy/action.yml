name: Simulated environment deployment
description: Descarga un artefacto inmutable, verifica su identidad y simula su despliegue.

inputs:
  environment:
    description: Environment de GitHub de destino
    required: true
  artifact_run_id:
    description: Ejecución que contiene el artefacto de la aplicación
    required: true
  artifact_name:
    description: Nombre del artefacto candidato inmutable
    required: true
  artifact_digest:
    description: Digest esperado del candidato inmutable
    required: true
  commit_sha:
    description: Commit representado por el artefacto
    required: true
  branch:
    description: Rama de origen
    required: true
  version:
    description: Versión de la aplicación
    required: true
  deploy_token:
    description: Credencial de demostración para el despliegue
    required: true

runs:
  using: composite
  steps:
    - name: Download the CI artifact (no rebuild)
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: artifact
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact_run_id }}
    - name: Verify candidate identity and integrity
      shell: bash
      env:
        EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
        EXPECTED_SHA: ${{ inputs.commit_sha }}
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        test -f artifact/candidate.env
        test -f artifact/image.tar
        test -f artifact/image.sha256
        ACTUAL_DIGEST="sha256:$(sha256sum artifact/image.tar | cut -d' ' -f1)"
        test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
        grep -Fxq "digest=$EXPECTED_DIGEST" artifact/candidate.env
        grep -Fxq "source_sha=$EXPECTED_SHA" artifact/candidate.env
        grep -Fxq "version=$EXPECTED_VERSION" artifact/candidate.env
        (cd artifact && sha256sum --check image.sha256)
    - name: Simulate deployment
      shell: bash
      env:
        APP_NAME: ci-cd-environments-demo
        APP_ENVIRONMENT: ${{ inputs.environment }}
        APP_VERSION: ${{ inputs.version }}
        APP_COMMIT_SHA: ${{ inputs.commit_sha }}
        APP_BRANCH: ${{ inputs.branch }}
        DEMO_DEPLOY_TOKEN: ${{ inputs.deploy_token }}
      run: |
        case "$APP_ENVIRONMENT" in
          dev|qa|prod) ;;
          *)
            echo "::error::Ambiente de despliegue no permitido: $APP_ENVIRONMENT"
            exit 1
            ;;
        esac
        test -n "$DEMO_DEPLOY_TOKEN" || {
          echo "::error::Falta el secret DEMO_DEPLOY_TOKEN en el Environment $APP_ENVIRONMENT"
          exit 1
        }
        docker load --input artifact/image.tar
        SOURCE_IMAGE=$(sed -n 's/^image_ref=//p' artifact/build.env)
        RELEASE_IMAGE=$(sed -n 's/^image_ref=//p' artifact/candidate.env)
        SOURCE_ID=$(docker image inspect "$SOURCE_IMAGE" --format '{{.Id}}')
        docker tag "$SOURCE_IMAGE" "$RELEASE_IMAGE"
        test "$(docker image inspect "$RELEASE_IMAGE" --format '{{.Id}}')" = "$SOURCE_ID"
        DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        {
          echo "## Despliegue exitoso"
          echo "| Campo | Valor |"
          echo "|---|---|"
          echo "| Aplicación | $APP_NAME |"
          echo "| Ambiente | $APP_ENVIRONMENT |"
          echo "| Rama | $APP_BRANCH |"
          echo "| Commit | $APP_COMMIT_SHA |"
          echo "| Versión | $APP_VERSION |"
          echo "| Digest del artefacto | ${{ inputs.artifact_digest }} |"
          echo "| Desplegado en | $DEPLOYED_AT |"
          echo "| Ejecución de origen | ${{ inputs.artifact_run_id }} |"
        } >> "$GITHUB_STEP_SUMMARY"
