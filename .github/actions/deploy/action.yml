name: Simulated environment deployment
description: Descarga un artefacto inmutable, simula su despliegue y opcionalmente valida QA.

inputs:
  environment:
    description: Environment de GitHub de destino
    required: true
  artifact_run_id:
    description: Ejecución que contiene el artefacto de la aplicación
    required: true
  artifact_name:
    description: Nombre del artefacto candidato inmutable
    required: true
  artifact_digest:
    description: Digest esperado del candidato inmutable
    required: true
  commit_sha:
    description: Commit representado por el artefacto
    required: true
  branch:
    description: Rama de origen
    required: true
  version:
    description: Versión de la aplicación
    required: true
  deploy_token:
    description: Credencial de demostración para el despliegue
    required: true
  validate_qa:
    description: Ejecutar pruebas de humo en QA
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download the CI artifact (no rebuild)
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: artifact
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact_run_id }}
    - name: Verify candidate identity and integrity
      shell: bash
      env:
        EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
        EXPECTED_SHA: ${{ inputs.commit_sha }}
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        test -f artifact/candidate.env
        test -f artifact/checksums.sha256
        ACTUAL_DIGEST="sha256:$(sha256sum artifact/checksums.sha256 | cut -d' ' -f1)"
        test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
        grep -Fxq "digest=$EXPECTED_DIGEST" artifact/candidate.env
        grep -Fxq "source_sha=$EXPECTED_SHA" artifact/candidate.env
        grep -Fxq "version=$EXPECTED_VERSION" artifact/candidate.env
        (cd artifact/app && sha256sum --check ../checksums.sha256)
    - name: Simulate deployment
      shell: bash
      env:
        APP_NAME: ci-cd-environments-demo
        APP_ENVIRONMENT: ${{ inputs.environment }}
        APP_VERSION: ${{ inputs.version }}
        APP_COMMIT_SHA: ${{ inputs.commit_sha }}
        APP_BRANCH: ${{ inputs.branch }}
        DEMO_DEPLOY_TOKEN: ${{ inputs.deploy_token }}
      run: |
        case "$APP_ENVIRONMENT" in
          dev|qa|prod) ;;
          *)
            echo "::error::Ambiente de despliegue no permitido: $APP_ENVIRONMENT"
            exit 1
            ;;
        esac
        test -n "$DEMO_DEPLOY_TOKEN" || {
          echo "::error::Falta el secret DEMO_DEPLOY_TOKEN en el Environment $APP_ENVIRONMENT"
          exit 1
        }
        test -f artifact/app/Cicd.Demo.Api.dll || {
          echo "::error::El artefacto no contiene Cicd.Demo.Api.dll"
          exit 1
        }
        DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        {
          echo "## Despliegue exitoso"
          echo "| Campo | Valor |"
          echo "|---|---|"
          echo "| Aplicación | $APP_NAME |"
          echo "| Ambiente | $APP_ENVIRONMENT |"
          echo "| Rama | $APP_BRANCH |"
          echo "| Commit | $APP_COMMIT_SHA |"
          echo "| Versión | $APP_VERSION |"
          echo "| Digest del artefacto | ${{ inputs.artifact_digest }} |"
          echo "| Desplegado en | $DEPLOYED_AT |"
          echo "| Ejecución de origen | ${{ inputs.artifact_run_id }} |"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Validate QA deployment
      if: inputs.validate_qa == 'true'
      shell: bash
      env:
        APP_ENVIRONMENT: ${{ inputs.environment }}
        APP_VERSION: ${{ inputs.version }}
        APP_COMMIT_SHA: ${{ inputs.commit_sha }}
        APP_BRANCH: ${{ inputs.branch }}
        APP_DEPLOYED_AT: ${{ github.run_id }}
      run: |
        test "$APP_ENVIRONMENT" = "qa"
        ASPNETCORE_URLS=http://127.0.0.1:5088 dotnet artifact/app/Cicd.Demo.Api.dll > qa-api.log 2>&1 &
        API_PID=$!
        trap 'kill "$API_PID" 2>/dev/null || true' EXIT

        READY=false
        for attempt in {1..15}; do
          if curl --fail --silent http://127.0.0.1:5088/health > health.json; then
            READY=true
            break
          fi
          sleep 1
        done
        test "$READY" = "true"
        test "$(jq -r '.status' health.json)" = "healthy"

        curl --fail --silent http://127.0.0.1:5088/environment > environment.json
        test "$(jq -r '.environment' environment.json)" = "qa"

        curl --fail --silent http://127.0.0.1:5088/version > version.json
        test "$(jq -r '.version' version.json)" = "$APP_VERSION"
        test "$(jq -r '.commit' version.json)" = "$APP_COMMIT_SHA"
        test "$(jq -r '.branch' version.json)" = "$APP_BRANCH"

        curl --fail --silent http://127.0.0.1:5088/promotion > promotion.json
        test "$(jq -r '.strategy' promotion.json)" = "build-once-promote-by-digest"
        test "$(jq -r '.version' promotion.json)" = "$APP_VERSION"
        test "$(jq -r '.commit' promotion.json)" = "$APP_COMMIT_SHA"

        printf '%s\n' \
          "commit=$APP_COMMIT_SHA" \
          "version=$APP_VERSION" \
          "branch=$APP_BRANCH" \
          "digest=${{ inputs.artifact_digest }}" \
          "ci_run=${{ inputs.artifact_run_id }}" > qa-smoke-evidence.txt
    - name: Record successful QA evidence
      if: inputs.validate_qa == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: qa-smoke-evidence-${{ inputs.commit_sha }}-${{ inputs.artifact_run_id }}
        path: qa-smoke-evidence.txt
        if-no-files-found: error
        retention-days: 30
        overwrite: true
    - name: Upload QA diagnostics on failure
      if: failure() && inputs.validate_qa == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: qa-diagnostics-${{ inputs.commit_sha }}-${{ github.run_id }}
        path: |
          qa-api.log
          health.json
          environment.json
          version.json
        if-no-files-found: warn
        retention-days: 14
