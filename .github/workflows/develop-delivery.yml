name: Develop Delivery

on:
  push:
    branches: [develop]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: develop-delivery
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore
        name: Restore
      - run: dotnet build --configuration Release --no-restore
        name: Build
      - name: Create deployable artifact
        run: |
          dotnet publish src/Cicd.Demo.Api/Cicd.Demo.Api.csproj --configuration Release --no-build --no-restore --output build/app /p:UseAppHost=false
          (cd build/app && find . -type f -print0 | sort -z | xargs -0 sha256sum) > build/checksums.sha256
      - name: Preserve test binaries
        run: tar -cf compiled-output.tar src/Cicd.Demo.Api/bin/Release src/Cicd.Demo.Api/obj tests/Cicd.Demo.Api.Tests/bin/Release tests/Cicd.Demo.Api.Tests/obj
      - uses: actions/upload-artifact@v4
        with:
          name: deployable-${{ github.run_id }}
          path: build
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-output-${{ github.run_id }}
          path: compiled-output.tar
          retention-days: 1

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: deployable-${{ github.run_id }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: compiled-output-${{ github.run_id }}
          path: .
      - name: Restore compiled output
        run: tar -xf compiled-output.tar
      - name: Unit tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Integration tests
        run: |
          test -f build/app/Cicd.Demo.Api.dll
          (cd build/app && sha256sum --check ../checksums.sha256)
          echo "SIMULATED - integration test suite against the deployable artifact"
      - name: Generate simulated coverage
        run: |
          mkdir -p reports/coverage
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<CoverageSession simulated="true" line-rate="0.82" branch-rate="0.76" />' > reports/coverage/coverage.opencover.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage/coverage.opencover.xml

  code-quality:
    name: Code quality scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage
      - name: Code linting
        run: echo "SIMULATED - dotnet format and linting rules"
      - name: SonarQube analysis
        run: |
          test -s reports/coverage/coverage.opencover.xml
          grep -q 'simulated="true"' reports/coverage/coverage.opencover.xml
          echo "SIMULATED: SonarQube analysis"
      - name: Coverage analysis
        run: echo "SIMULATED - coverage threshold satisfied"
      - name: Quality gate
        run: echo "SIMULATED - quality gate passed"

  security-checks:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST scan
        run: echo "SIMULATED - Semgrep SAST"
      - name: Secret scan
        run: echo "SIMULATED - Gitleaks secret scanning"
      - name: Dependency scan
        run: echo "SIMULATED - OWASP Dependency Check"
      - name: Vulnerability policy
        run: echo "SIMULATED - no blocking vulnerabilities"

  delivery-checks:
    name: Delivery checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile lint
        run: echo "SIMULATED - Hadolint"
      - name: IaC scan
        run: echo "SIMULATED - Checkov"
      - name: Workflow validation
        run: echo "SIMULATED - actionlint"

  release:
    name: Release
    needs: [build, tests, code-quality, security-checks, delivery-checks]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.identity.outputs.digest }}
      artifact_name: ${{ steps.identity.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
      artifact_run_id: ${{ github.run_id }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployable-${{ github.run_id }}
          path: release
      - name: Assign official version and metadata
        id: identity
        run: |
          DIGEST="sha256:$(sha256sum release/checksums.sha256 | cut -d' ' -f1)"
          VERSION="0.1.0-${GITHUB_RUN_ID}"
          ARTIFACT_NAME="candidate-${GITHUB_SHA}"
          printf 'source_sha=%s\nsource_branch=%s\nsource_run=%s\nversion=%s\ndigest=%s\nformat=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$VERSION" "$DIGEST" "dotnet-publish" > release/candidate.env
          printf 'digest=%s\nversion=%s\nname=%s\n' "$DIGEST" "$VERSION" "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        run: |
          printf '{"spdxVersion":"SPDX-2.3","name":"cicd-demo-api","documentNamespace":"https://example.invalid/sbom/%s","creationInfo":{"comment":"SIMULATED SBOM"}}\n' "$GITHUB_SHA" > release/sbom.spdx.json
      - name: Verify integrity
        env:
          EXPECTED_DIGEST: ${{ steps.identity.outputs.digest }}
        run: |
          ACTUAL_DIGEST="sha256:$(sha256sum release/checksums.sha256 | cut -d' ' -f1)"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          (cd release/app && sha256sum --check ../checksums.sha256)
      - name: Binary vulnerability scan
        run: echo "SIMULATED - binary vulnerability scan"
      - name: Dependency vulnerability scan
        run: echo "SIMULATED - release dependency vulnerability scan"
      - name: Malware scan
        run: echo "SIMULATED - malware scan"
      - name: Validate SBOM
        run: grep -q 'SPDX-2.3' release/sbom.spdx.json
      - name: Release policy
        run: echo "SIMULATED - release policy passed"
      - name: Publish immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: release
          retention-days: 30

  deploy-dev:
    name: Deploy DEV
    needs: release
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: dev
          artifact_run_id: ${{ needs.release.outputs.artifact_run_id }}
          artifact_name: ${{ needs.release.outputs.artifact_name }}
          artifact_digest: ${{ needs.release.outputs.artifact_digest }}
          commit_sha: ${{ needs.release.outputs.source_sha }}
          branch: develop
          version: ${{ needs.release.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}

  verify-dev-deployment:
    name: Verify DEV deployment
    needs: [release, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-deployment
        with:
          environment: dev
          artifact_run_id: ${{ needs.release.outputs.artifact_run_id }}
          artifact_name: ${{ needs.release.outputs.artifact_name }}
          artifact_digest: ${{ needs.release.outputs.artifact_digest }}
          commit_sha: ${{ needs.release.outputs.source_sha }}
          branch: develop
          version: ${{ needs.release.outputs.version }}

  rollback-dev:
    name: Rollback DEV
    needs: [release, deploy-dev, verify-dev-deployment]
    if: >-
      always() &&
      (needs.deploy-dev.result == 'failure' || needs.verify-dev-deployment.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rollback
        with:
          environment: dev
          failed_commit_sha: ${{ needs.release.outputs.source_sha }}
          failed_artifact_digest: ${{ needs.release.outputs.artifact_digest }}
          rollback_token: simulated-rollback-authorization
