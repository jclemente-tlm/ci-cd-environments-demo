name: Develop Delivery

on:
  push:
    branches: [develop]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: develop-delivery
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore
        name: Restore
      - run: dotnet build --configuration Release --no-restore
        name: Build
      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
        name: Test
      - name: Generate simulated coverage
        run: |
          mkdir -p reports/coverage
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<CoverageSession simulated="true" line-rate="0.82" branch-rate="0.76" />' > reports/coverage/coverage.opencover.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage/coverage.opencover.xml
      - name: Bundle compiled output
        run: tar -cf compiled-output.tar src/Cicd.Demo.Api/bin/Release src/Cicd.Demo.Api/obj
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-output-${{ github.run_id }}
          path: compiled-output.tar
          retention-days: 1

  code-quality:
    name: Code quality
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage
      - run: |
          test -s reports/coverage/coverage.opencover.xml
          grep -q 'simulated="true"' reports/coverage/coverage.opencover.xml
          echo "## Code quality — SIMULATED" >> "$GITHUB_STEP_SUMMARY"

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "SIMULATED: Semgrep SAST"
          echo "SIMULATED: Gitleaks secret scanning"
          echo "SIMULATED: OWASP Dependency Check"

  delivery-checks:
    name: Delivery checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "SIMULATED: Hadolint"
          echo "SIMULATED: Checkov IaC scan"
          echo "SIMULATED: actionlint workflow validation"

  package:
    name: Package
    needs: [build-test, code-quality, security-checks, delivery-checks]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.identity.outputs.digest }}
      artifact_name: ${{ steps.identity.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: compiled-output-${{ github.run_id }}
          path: .
      - run: tar -xf compiled-output.tar
        name: Restore compiled output
      - name: Package without rebuilding
        run: dotnet publish src/Cicd.Demo.Api/Cicd.Demo.Api.csproj --configuration Release --no-build --no-restore --output artifacts/app /p:UseAppHost=false
      - name: Create immutable identity
        id: identity
        run: |
          (cd artifacts/app && find . -type f -print0 | sort -z | xargs -0 sha256sum) > artifacts/checksums.sha256
          DIGEST="sha256:$(sha256sum artifacts/checksums.sha256 | cut -d' ' -f1)"
          VERSION="0.1.0-${GITHUB_RUN_ID}"
          ARTIFACT_NAME="candidate-${GITHUB_SHA}"
          printf 'source_sha=%s\nsource_branch=%s\nsource_run=%s\nversion=%s\ndigest=%s\nformat=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$VERSION" "$DIGEST" "dotnet-publish" > artifacts/candidate.env
          printf 'digest=%s\nversion=%s\nname=%s\n' "$DIGEST" "$VERSION" "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-output-${{ github.run_id }}
          path: artifacts
          retention-days: 1

  artifact-scan:
    name: Artifact scan
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaged-output-${{ github.run_id }}
          path: artifacts
      - name: Verify and scan artifact
        env:
          EXPECTED_DIGEST: ${{ needs.package.outputs.artifact_digest }}
        run: |
          ACTUAL_DIGEST="sha256:$(sha256sum artifacts/checksums.sha256 | cut -d' ' -f1)"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          (cd artifacts/app && sha256sum --check ../checksums.sha256)
          echo "SIMULATED: SCA, antivirus and SBOM"

  publish-artifact:
    name: Publish
    needs: [package, artifact-scan]
    runs-on: ubuntu-latest
    outputs:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.package.outputs.artifact_name }}
      artifact_digest: ${{ needs.package.outputs.artifact_digest }}
      version: ${{ needs.package.outputs.version }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaged-output-${{ github.run_id }}
          path: artifacts
      - run: grep -Fxq "digest=${{ needs.package.outputs.artifact_digest }}" artifacts/candidate.env
        name: Verify publication metadata
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: artifacts
          retention-days: 30

  deploy-dev:
    name: Deploy DEV
    needs: publish-artifact
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: dev
          artifact_run_id: ${{ needs.publish-artifact.outputs.artifact_run_id }}
          artifact_name: ${{ needs.publish-artifact.outputs.artifact_name }}
          artifact_digest: ${{ needs.publish-artifact.outputs.artifact_digest }}
          commit_sha: ${{ needs.publish-artifact.outputs.source_sha }}
          branch: develop
          version: ${{ needs.publish-artifact.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}

  verify-dev-deployment:
    name: Verify DEV deployment
    needs: [publish-artifact, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-deployment
        with:
          environment: dev
          artifact_run_id: ${{ needs.publish-artifact.outputs.artifact_run_id }}
          artifact_name: ${{ needs.publish-artifact.outputs.artifact_name }}
          artifact_digest: ${{ needs.publish-artifact.outputs.artifact_digest }}
          commit_sha: ${{ needs.publish-artifact.outputs.source_sha }}
          branch: develop
          version: ${{ needs.publish-artifact.outputs.version }}

  rollback-dev:
    name: Rollback DEV
    needs: [publish-artifact, deploy-dev, verify-dev-deployment]
    if: >-
      always() &&
      (needs.deploy-dev.result == 'failure' || needs.verify-dev-deployment.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rollback
        with:
          environment: dev
          failed_commit_sha: ${{ needs.publish-artifact.outputs.source_sha }}
          failed_artifact_digest: ${{ needs.publish-artifact.outputs.artifact_digest }}
          rollback_token: simulated-rollback-authorization
