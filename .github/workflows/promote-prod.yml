name: Promote PROD

on:
  workflow_run:
    workflows: [QA Sign-off]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  resolve-candidate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
      commit_sha: ${{ steps.evidence.outputs.commit_sha }}
      version: ${{ steps.evidence.outputs.version }}
    steps:
      - name: Download approved QA evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qa-signoff-*
          path: evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate approved candidate
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SIGNOFF_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test "$(find evidence -name qa-signoff.json -type f | wc -l)" -eq 1
          EVIDENCE_FILE=$(find evidence -name qa-signoff.json -type f)
          CI_RUN_ID=$(jq -er '.ci_run_id' "$EVIDENCE_FILE")
          COMMIT_SHA=$(jq -er '.commit_sha' "$EVIDENCE_FILE")
          VERSION=$(jq -er '.version' "$EVIDENCE_FILE")
          test "$(jq -er '.branch' "$EVIDENCE_FILE")" = "main"
          test "$(jq -er '.signoff_run_id' "$EVIDENCE_FILE")" = "$SIGNOFF_RUN_ID"

          CI_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$CI_RUN_ID")
          test "$(jq -r '.name' <<< "$CI_JSON")" = "CI/CD Pipeline"
          test "$(jq -r '.conclusion' <<< "$CI_JSON")" = "success"
          test "$(jq -r '.head_branch' <<< "$CI_JSON")" = "main"
          test "$(jq -r '.head_sha' <<< "$CI_JSON")" = "$COMMIT_SHA"
          test "$VERSION" = "0.1.0-$CI_RUN_ID"

          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy-prod:
    needs: resolve-candidate
    name: Deploy PROD
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deployment-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: prod
          artifact_run_id: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          commit_sha: ${{ needs.resolve-candidate.outputs.commit_sha }}
          branch: main
          version: ${{ needs.resolve-candidate.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}
