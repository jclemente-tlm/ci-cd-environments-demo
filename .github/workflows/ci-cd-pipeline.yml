name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'hotfix/**', 'refactor/**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
      - name: Package deployable application
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: dotnet publish src/Cicd.Demo.Api/Cicd.Demo.Api.csproj --configuration Release --no-build --output artifacts/app /p:UseAppHost=false
      - name: Upload immutable build artifact
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: artifacts/app
          if-no-files-found: error
          retention-days: 30

  deploy-dev:
    name: Deploy DEV
    needs: build-test-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deployment-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: dev
          artifact_run_id: ${{ github.run_id }}
          commit_sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          version: 0.1.0-${{ github.run_id }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}

  deploy-qa:
    name: Deploy QA
    needs: build-test-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: deployment-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: qa
          artifact_run_id: ${{ github.run_id }}
          commit_sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          version: 0.1.0-${{ github.run_id }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}
          validate_qa: 'true'
