name: Continuous Integration

on:
  push:
    branches: ['feature/**', 'fix/**', 'refactor/**', 'sync/**', 'hotfix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch or PR route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$BASE_BRANCH:$HEAD_BRANCH" in
              develop:feature/*|develop:fix/*|develop:refactor/*|develop:sync/*|develop:hotfix/*|develop:main) ;;
              *) echo "Ruta de PR no permitida: $HEAD_BRANCH -> $BASE_BRANCH" >&2; exit 1 ;;
            esac
          else
            case "$HEAD_BRANCH" in
              feature/*|fix/*|refactor/*|sync/*|hotfix/*|develop|main) ;;
              *) echo "Rama no autorizada para CI: $HEAD_BRANCH" >&2; exit 1 ;;
            esac
          fi

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Preserve compiled output
        run: tar -cf compiled-output.tar src/Cicd.Demo.Api/bin/Release src/Cicd.Demo.Api/obj tests/Cicd.Demo.Api.Tests/bin/Release tests/Cicd.Demo.Api.Tests/obj
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-output-${{ github.run_id }}
          path: compiled-output.tar
          retention-days: 1

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: compiled-output-${{ github.run_id }}
          path: .
      - name: Restore compiled output
        run: tar -xf compiled-output.tar
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Integration tests
        run: echo "SIMULATED - integration test suite"
      - name: Generate simulated coverage report
        run: |
          mkdir -p reports/coverage
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<CoverageSession simulated="true" line-rate="0.82" branch-rate="0.76" />' > reports/coverage/coverage.opencover.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
      - name: Publish simulated coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage/coverage.opencover.xml

  code-quality:
    name: Code quality scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage
      - name: Code linting
        run: echo "SIMULATED - dotnet format and linting rules"
      - name: SonarQube analysis
        run: |
          test -s reports/coverage/coverage.opencover.xml
          grep -q 'simulated="true"' reports/coverage/coverage.opencover.xml
          echo "SIMULATED: SonarQube analysis"
      - name: Coverage analysis
        run: echo "SIMULATED - coverage threshold satisfied"
      - name: Quality gate
        run: echo "SIMULATED - quality gate passed"

  security-checks:
    name: Security scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST scan
        run: echo "SIMULATED - Semgrep SAST"
      - name: Secret scan
        run: echo "SIMULATED - Gitleaks secret scanning"
      - name: Dependency scan
        run: echo "SIMULATED - OWASP Dependency Check"
      - name: Vulnerability policy
        run: echo "SIMULATED - no blocking vulnerabilities"

  delivery-checks:
    name: Delivery checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile lint
        run: echo "SIMULATED - Hadolint"
      - name: IaC scan
        run: echo "SIMULATED - Checkov"
      - name: Workflow validation
        run: echo "SIMULATED - actionlint"
