name: Continuous Integration

on:
  push:
    branches: ['feature/**', 'fix/**', 'refactor/**', 'sync/**', 'hotfix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch or PR route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$BASE_BRANCH:$HEAD_BRANCH" in
              develop:feature/*|develop:fix/*|develop:refactor/*|develop:sync/*|develop:hotfix/*|develop:main) ;;
              *) echo "Ruta de PR no permitida: $HEAD_BRANCH -> $BASE_BRANCH" >&2; exit 1 ;;
            esac
          else
            case "$HEAD_BRANCH" in
              feature/*|fix/*|refactor/*|sync/*|hotfix/*|develop|main) ;;
              *) echo "Rama no autorizada para CI: $HEAD_BRANCH" >&2; exit 1 ;;
            esac
          fi

  build-test:
    name: Build and unit tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Generate simulated coverage report
        run: |
          mkdir -p reports/coverage
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<CoverageSession simulated="true" line-rate="0.82" branch-rate="0.76" />' > reports/coverage/coverage.opencover.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
      - name: Publish simulated coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage/coverage.opencover.xml

  code-quality:
    name: Code quality
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage
      - name: Simulate SonarQube Quality Gate
        run: |
          test -s reports/coverage/coverage.opencover.xml
          grep -q 'simulated="true"' reports/coverage/coverage.opencover.xml
          echo "## Code quality — SIMULATED" >> "$GITHUB_STEP_SUMMARY"

  security-checks:
    name: Security checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate security gates
        run: |
          echo "SIMULATED: Semgrep SAST"
          echo "SIMULATED: Gitleaks secret scanning"
          echo "SIMULATED: OWASP Dependency Check"

  delivery-checks:
    name: Delivery checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate delivery gates
        run: |
          echo "SIMULATED: Hadolint"
          echo "SIMULATED: Checkov IaC scan"
          echo "SIMULATED: actionlint workflow validation"
