name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'hotfix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-route:
    name: Validate branch route
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate source, destination and ancestry
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:fix/*|develop:refactor/*|develop:sync/*|develop:main|main:develop|main:release/*|main:hotfix/*)
              ;;
            *)
              echo "Ruta de PR no permitida: $HEAD_BRANCH -> $BASE_BRANCH" >&2
              exit 1
              ;;
          esac

          if [[ "$BASE_BRANCH:$HEAD_BRANCH" == "main:develop" ]]; then
            git fetch --no-tags origin main
            if git cat-file -e origin/main:.github/actions/resolve-candidate/action.yml 2>/dev/null; then
              echo "La instalación inicial ya terminó; use release/* o hotfix/* para integrar en main." >&2
              exit 1
            fi
            echo "Bootstrap permitido: main todavía no contiene las acciones confiables de promoción."
          fi

          if [[ "$HEAD_BRANCH" == release/* || "$HEAD_BRANCH" == hotfix/* ]]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor origin/main HEAD || {
              echo "$HEAD_BRANCH debe incluir el estado actual de main." >&2
              exit 1
            }
          fi

          if [[ "$HEAD_BRANCH" == hotfix/* ]]; then
            if git rev-list --merges origin/main..HEAD | grep -q .; then
              echo "$HEAD_BRANCH no debe contener merges de otra línea de desarrollo." >&2
              exit 1
            fi
          fi

          echo "Ruta de PR permitida: $HEAD_BRANCH -> $BASE_BRANCH"

  build-test-package:
    name: Build and unit tests
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.identity.outputs.digest }}
      artifact_name: ${{ steps.identity.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Generate simulated coverage report
        shell: bash
        run: |
          mkdir -p reports/coverage
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<CoverageSession simulated="true" line-rate="0.82" branch-rate="0.76" />' \
            > reports/coverage/coverage.opencover.xml
          echo "SIMULATED: reporte OpenCover generado para demostrar la entrada de SonarQube."
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
      - name: Publish simulated coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage/coverage.opencover.xml
          if-no-files-found: error
      - name: Package deployable application
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/hotfix/'))
        run: dotnet publish src/Cicd.Demo.Api/Cicd.Demo.Api.csproj --configuration Release --no-build --output artifacts/app /p:UseAppHost=false
      - name: Create immutable candidate identity
        id: identity
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/hotfix/'))
        shell: bash
        run: |
          (
            cd artifacts/app
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > artifacts/checksums.sha256
          DIGEST="sha256:$(sha256sum artifacts/checksums.sha256 | cut -d' ' -f1)"
          VERSION="0.1.0-${GITHUB_RUN_ID}"
          ARTIFACT_NAME="candidate-${GITHUB_SHA}"
          printf 'source_sha=%s\nsource_branch=%s\nsource_run=%s\nversion=%s\ndigest=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$VERSION" "$DIGEST" \
            > artifacts/candidate.env
          {
            echo "digest=$DIGEST"
            echo "version=$VERSION"
            echo "name=$ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable build artifact
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/hotfix/'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  code-quality:
    name: Code quality
    needs: build-test-package
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/coverage
      - name: Simulate SonarQube Quality Gate
        shell: bash
        run: |
          test -s reports/coverage/coverage.opencover.xml
          grep -q 'simulated="true"' reports/coverage/coverage.opencover.xml
          {
            echo "## Code quality — SIMULATED"
            echo "- Coverage report: OpenCover disponible"
            echo "- SonarQube Quality Gate: OK"
            echo "- Política: block"
          } >> "$GITHUB_STEP_SUMMARY"

  security-checks:
    name: Security checks
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Semgrep SAST
        run: |
          echo "SIMULATED: Semgrep SAST sin hallazgos bloqueantes."
      - name: Simulate Gitleaks secret scanning
        run: |
          echo "SIMULATED: Gitleaks no detectó secretos."
      - name: Simulate OWASP Dependency Check
        run: |
          echo "SIMULATED: Dependency Check sin vulnerabilidades críticas."
      - name: Record simulated security results
        run: |
          {
            echo "## Security checks — SIMULATED"
            echo "- Semgrep: pass — block"
            echo "- Gitleaks: pass — block"
            echo "- Dependency Check: pass — crítico bloquea, alto advierte"
          } >> "$GITHUB_STEP_SUMMARY"

  delivery-checks:
    name: Delivery checks
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Hadolint
        run: |
          echo "SIMULATED: Hadolint report only."
      - name: Simulate Checkov IaC scan
        run: |
          echo "SIMULATED: Checkov sin hallazgos bloqueantes; no hay IaC real en la PoC."
      - name: Simulate Trivy filesystem scan
        run: |
          echo "SIMULATED: Trivy FS report only; Trivy Image queda pendiente de una imagen Docker real."
      - name: Record simulated delivery results
        run: |
          {
            echo "## Delivery checks — SIMULATED"
            echo "- Hadolint: report only"
            echo "- Checkov: pass — block cuando exista IaC"
            echo "- Trivy FS: report only"
            echo "- Trivy Image: no aplicable hasta construir una imagen Docker"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy DEV
    needs: [build-test-package, code-quality, security-checks, delivery-checks]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deployment-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: dev
          artifact_run_id: ${{ github.run_id }}
          artifact_name: ${{ needs.build-test-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-test-package.outputs.artifact_digest }}
          commit_sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          version: ${{ needs.build-test-package.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}

  deploy-qa:
    name: Deploy QA
    needs: [build-test-package, code-quality, security-checks, delivery-checks]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: deployment-qa
      cancel-in-progress: false
    outputs:
      artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout trusted deployment actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Resolve the artifact built for the PR head
        id: candidate
        uses: ./.github/actions/resolve-candidate
        with:
          commit_sha: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/deploy
        with:
          environment: qa
          artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id }}
          artifact_name: ${{ steps.candidate.outputs.artifact_name }}
          artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
          branch: ${{ github.head_ref }}
          version: ${{ steps.candidate.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}
          validate_qa: 'true'

  qa-ready:
    name: QA deployment ready for functional testing
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - name: Record candidate under functional validation
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          {
            echo "## Candidato listo en QA"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Pull request | #${{ github.event.pull_request.number }} |"
            echo "| Rama de liberación | $RELEASE_BRANCH |"
            echo "| Commit de origen | ${{ github.event.pull_request.head.sha }} |"
            echo "| Versión | ${{ needs.deploy-qa.outputs.version }} |"
            echo "| Digest del artefacto | ${{ needs.deploy-qa.outputs.artifact_digest }} |"
            echo "| Ejecución de CI | ${{ needs.deploy-qa.outputs.artifact_run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy PROD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deployment-prod
      cancel-in-progress: false
    steps:
      - name: Checkout trusted deployment actions
        uses: actions/checkout@v4
      - name: Identify the merged release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.merged_at != null and .base.ref == "main" and ((.head.ref | startswith("release/")) or (.head.ref | startswith("hotfix/"))))) | first | [.head.sha, .head.ref] | @tsv')
          test -n "$RELEASE"
          IFS=$'\t' read -r SOURCE_SHA SOURCE_BRANCH <<< "$RELEASE"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_branch=$SOURCE_BRANCH"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve the artifact approved in QA
        id: candidate
        uses: ./.github/actions/resolve-candidate
        with:
          commit_sha: ${{ steps.release.outputs.source_sha }}
      - uses: ./.github/actions/deploy
        with:
          environment: prod
          artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id }}
          artifact_name: ${{ steps.candidate.outputs.artifact_name }}
          artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
          commit_sha: ${{ steps.release.outputs.source_sha }}
          branch: main
          version: ${{ steps.candidate.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}
