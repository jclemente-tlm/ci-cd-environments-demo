name: Release PROD

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: deployment-prod
  cancel-in-progress: false

jobs:
  resolve-candidate:
    name: Resolve merged candidate
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    outputs:
      artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      version: ${{ steps.candidate.outputs.version }}
      source_branch: ${{ steps.candidate.outputs.source_branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the artifact approved in QA
        id: candidate
        uses: ./.github/actions/resolve-candidate
        with:
          commit_sha: ${{ github.event.pull_request.head.sha }}

  deploy-prod:
    name: Deploy PROD
    needs: resolve-candidate
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: prod
          artifact_run_id: ${{ needs.resolve-candidate.outputs.artifact_run_id }}
          artifact_name: ${{ needs.resolve-candidate.outputs.artifact_name }}
          artifact_digest: ${{ needs.resolve-candidate.outputs.artifact_digest }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
          branch: ${{ github.event.pull_request.head.ref }}
          version: ${{ needs.resolve-candidate.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}
