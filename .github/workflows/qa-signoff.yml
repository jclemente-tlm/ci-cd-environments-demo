name: QA Sign-off

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID de la ejecución CI exitosa sobre main
        required: true
        type: string
      commit_sha:
        description: SHA completo validado funcionalmente en QA
        required: true
        type: string
      test_reference:
        description: Referencia al plan, ticket o evidencia de pruebas
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-candidate:
    name: Validar candidato y evidencia técnica
    runs-on: ubuntu-latest
    outputs:
      smoke_run_id: ${{ steps.validate.outputs.smoke_run_id }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate release candidate and QA smoke evidence
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TEST_REFERENCE: ${{ inputs.test_reference }}
        run: |
          CI_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$CI_RUN_ID")
          test "$(jq -r '.name' <<< "$CI_JSON")" = "CI"
          test "$(jq -r '.conclusion' <<< "$CI_JSON")" = "success"
          test "$(jq -r '.head_branch' <<< "$CI_JSON")" = "main"
          test "$(jq -r '.head_sha' <<< "$CI_JSON")" = "$COMMIT_SHA"

          SMOKE_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts?name=qa-smoke-evidence-$COMMIT_SHA-$CI_RUN_ID&per_page=100")
          SMOKE_RUN_ID=$(jq -r \
            '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty' \
            <<< "$SMOKE_JSON")
          test -n "$SMOKE_RUN_ID"
          test "$SMOKE_RUN_ID" = "$CI_RUN_ID"

          VERSION="0.1.0-$CI_RUN_ID"
          echo "smoke_run_id=$SMOKE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  signoff:
    name: Registrar aprobación funcional
    needs: validate-candidate
    runs-on: ubuntu-latest
    environment: qa-signoff
    steps:
      - name: Record approved functional sign-off
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TEST_REFERENCE: ${{ inputs.test_reference }}
          SMOKE_RUN_ID: ${{ needs.validate-candidate.outputs.smoke_run_id }}
          VERSION: ${{ needs.validate-candidate.outputs.version }}
        run: |
          jq -n \
            --arg commit_sha "$COMMIT_SHA" \
            --arg version "$VERSION" \
            --arg branch "main" \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg qa_validation_run_id "$SMOKE_RUN_ID" \
            --arg signoff_run_id "${{ github.run_id }}" \
            --arg requested_by "${{ github.actor }}" \
            --arg test_reference "$TEST_REFERENCE" \
            '{
              commit_sha: $commit_sha,
              version: $version,
              branch: $branch,
              ci_run_id: $ci_run_id,
              qa_validation_run_id: $qa_validation_run_id,
              signoff_run_id: $signoff_run_id,
              requested_by: $requested_by,
              test_reference: $test_reference
            }' > qa-signoff.json

          {
            echo "## QA functional sign-off"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | $COMMIT_SHA |"
            echo "| Version | $VERSION |"
            echo "| CI run | $CI_RUN_ID |"
            echo "| QA validation run | $SMOKE_RUN_ID |"
            echo "| Test reference | $TEST_REFERENCE |"
            echo "| Requested by | ${{ github.actor }} |"
            echo "| Environment | qa-signoff |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload functional QA sign-off
        uses: actions/upload-artifact@v4
        with:
          name: qa-signoff-${{ inputs.commit_sha }}-${{ inputs.ci_run_id }}
          path: qa-signoff.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
