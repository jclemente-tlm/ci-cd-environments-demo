name: Release QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-candidate:
    name: Resolve candidate
    if: >-
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    outputs:
      artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      version: ${{ steps.candidate.outputs.version }}
      source_branch: ${{ steps.candidate.outputs.source_branch }}
    steps:
      - name: Checkout trusted deployment actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Resolve the artifact built for the PR head
        id: candidate
        uses: ./.github/actions/resolve-candidate
        with:
          commit_sha: ${{ github.event.pull_request.head.sha }}

  deploy-qa:
    name: Deploy QA
    needs: resolve-candidate
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: deployment-qa
      cancel-in-progress: false
    steps:
      - name: Checkout trusted deployment actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/deploy
        with:
          environment: qa
          artifact_run_id: ${{ needs.resolve-candidate.outputs.artifact_run_id }}
          artifact_name: ${{ needs.resolve-candidate.outputs.artifact_name }}
          artifact_digest: ${{ needs.resolve-candidate.outputs.artifact_digest }}
          commit_sha: ${{ github.event.pull_request.head.sha }}
          branch: ${{ github.head_ref }}
          version: ${{ needs.resolve-candidate.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}
          validate_qa: 'true'

  qa-ready:
    name: QA deployment ready for functional testing
    needs: [resolve-candidate, deploy-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Record candidate under functional validation
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          {
            echo "## QA candidate ready"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Pull request | #${{ github.event.pull_request.number }} |"
            echo "| Release branch | $RELEASE_BRANCH |"
            echo "| Source commit | ${{ github.event.pull_request.head.sha }} |"
            echo "| Version | ${{ needs.resolve-candidate.outputs.version }} |"
            echo "| Artifact digest | ${{ needs.resolve-candidate.outputs.artifact_digest }} |"
            echo "| CI run | ${{ needs.resolve-candidate.outputs.artifact_run_id }} |"
            echo
            echo "The workflow is complete. QA records functional sign-off as a required PR approval."
          } >> "$GITHUB_STEP_SUMMARY"
