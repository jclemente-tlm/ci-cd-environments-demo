name: Production Deployment

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve merged release
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify merged release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release/")))) | first | [.head.sha, .number] | @tsv')
          test -n "$RELEASE" || { echo "El push de main no corresponde a un release fusionado" >&2; exit 1; }
          IFS=$'\t' read -r SOURCE_SHA PR_NUMBER <<< "$RELEASE"
          printf 'source_sha=%s\npull_request=%s\n' "$SOURCE_SHA" "$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Resolve immutable candidate
        id: candidate
        uses: ./.github/actions/resolve-candidate
        with:
          commit_sha: ${{ steps.release.outputs.source_sha }}

  verify-qa-signoff:
    name: Verify QA sign-off
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - name: Locate successful QA sign-off evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
        run: |
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=qa-signoff-evidence-${SOURCE_SHA}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          test -n "$RUN_ID" || { echo "No existe evidencia QA sign-off para $SOURCE_SHA" >&2; exit 1; }
          RUN_METADATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '[.head_sha, .event, .conclusion, .path] | @tsv')
          IFS=$'\t' read -r RUN_SHA RUN_EVENT RUN_CONCLUSION RUN_PATH <<< "$RUN_METADATA"
          test "$RUN_SHA" = "$SOURCE_SHA"
          test "$RUN_EVENT" = "pull_request"
          test "$RUN_CONCLUSION" = "success"
          case "$RUN_PATH" in
            .github/workflows/release-to-qa.yml|.github/workflows/release-to-qa.yml@*) ;;
            *) echo "La evidencia no proviene del workflow Release to QA" >&2; exit 1 ;;
          esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: qa-signoff-evidence-${{ needs.resolve-release.outputs.source_sha }}
          path: qa-signoff-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
      - name: Match QA approval to production candidate
        env:
          SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          ARTIFACT_DIGEST: ${{ needs.resolve-release.outputs.artifact_digest }}
          ARTIFACT_RUN_ID: ${{ needs.resolve-release.outputs.artifact_run_id }}
          ARTIFACT_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          EVIDENCE=qa-signoff-evidence/qa-signoff.env
          test -f "$EVIDENCE"
          grep -Fxq "source_sha=$SOURCE_SHA" "$EVIDENCE"
          grep -Fxq "artifact_digest=$ARTIFACT_DIGEST" "$EVIDENCE"
          grep -Fxq "artifact_run_id=$ARTIFACT_RUN_ID" "$EVIDENCE"
          grep -Fxq "version=$ARTIFACT_VERSION" "$EVIDENCE"
          grep -Fxq "qa_tests=success" "$EVIDENCE"
          grep -Fxq "qa_signoff=approved" "$EVIDENCE"

  deploy-prod:
    name: Approve and deploy PROD
    needs: [resolve-release, verify-qa-signoff]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          environment: prod
          artifact_run_id: ${{ needs.resolve-release.outputs.artifact_run_id }}
          artifact_name: ${{ needs.resolve-release.outputs.artifact_name }}
          artifact_digest: ${{ needs.resolve-release.outputs.artifact_digest }}
          commit_sha: ${{ needs.resolve-release.outputs.source_sha }}
          branch: main
          version: ${{ needs.resolve-release.outputs.version }}
          deploy_token: ${{ secrets.DEMO_DEPLOY_TOKEN }}

  production-smoke-tests:
    name: Production smoke tests
    needs: [resolve-release, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-test
        with:
          environment: prod
          artifact_run_id: ${{ needs.resolve-release.outputs.artifact_run_id }}
          artifact_name: ${{ needs.resolve-release.outputs.artifact_name }}
          artifact_digest: ${{ needs.resolve-release.outputs.artifact_digest }}
          commit_sha: ${{ needs.resolve-release.outputs.source_sha }}
          branch: main
          version: ${{ needs.resolve-release.outputs.version }}
