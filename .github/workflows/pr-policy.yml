name: PR Policy

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-route:
    name: Validate branch route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate source, destination and ancestry
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|develop:fix/*|develop:refactor/*|develop:sync/*|develop:main|main:develop|main:fix/qa-*|main:hotfix/*)
              ;;
            *)
              echo "Unsupported PR route: $HEAD_BRANCH -> $BASE_BRANCH" >&2
              exit 1
              ;;
          esac

          if [ "$BASE_BRANCH" = "develop" ] && [[ "$HEAD_BRANCH" == fix/qa-* ]]; then
            echo "QA corrections must enter develop through main." >&2
            exit 1
          fi

          if [[ "$HEAD_BRANCH" == fix/qa-* || "$HEAD_BRANCH" == hotfix/* ]]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor origin/main HEAD || {
              echo "$HEAD_BRANCH must include the current main branch." >&2
              exit 1
            }

            if git rev-list --merges origin/main..HEAD | grep -q .; then
              echo "$HEAD_BRANCH must not merge another development line." >&2
              exit 1
            fi
          fi

          echo "Allowed PR route: $HEAD_BRANCH -> $BASE_BRANCH"
