name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  actions: read
  contents: read

jobs:
  context:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.values.outputs.run_id }}
      sha: ${{ steps.values.outputs.sha }}
      branch: ${{ steps.values.outputs.branch }}
      version: ${{ steps.values.outputs.version }}
    steps:
      - id: values
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=0.1.0-$RUN_ID" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: context
    if: needs.context.outputs.branch == 'develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      artifact_run_id: ${{ needs.context.outputs.run_id }}
      commit_sha: ${{ needs.context.outputs.sha }}
      branch: ${{ needs.context.outputs.branch }}
      version: ${{ needs.context.outputs.version }}
      cancel_in_progress: true
    secrets: inherit

  deploy-qa:
    needs: context
    if: needs.context.outputs.branch == 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      artifact_run_id: ${{ needs.context.outputs.run_id }}
      commit_sha: ${{ needs.context.outputs.sha }}
      branch: ${{ needs.context.outputs.branch }}
      version: ${{ needs.context.outputs.version }}
      validate_qa: true
    secrets: inherit
